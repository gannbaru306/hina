<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>雛ブレ物理予測エディタ</title>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.27/dist/planck.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #222; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        h1 { margin: 0 0 8px 0; font-size: 20px; text-align: center; }
        
        .main-container { display: flex; gap: 12px; max-width: 1250px; width: 100%; justify-content: center; align-items: flex-start; }
        
        .canvas-area { display: flex; flex-direction: column; width: 920px; }
        canvas { background: #111; border: 2px solid #555; display: block; cursor: crosshair; touch-action: none; width: 920px; height: 500px; }
        
        .bottom-bar { display: flex; gap: 8px; margin-top: 6px; align-items: center; justify-content: space-between; }
        .reset-group { display: flex; gap: 6px; }
        .reset-group button { padding: 5px 10px; font-size: 11px; width: auto; margin: 0; }

        .manual-launch-group { display: flex; align-items: center; gap: 5px; background: #333; padding: 4px 8px; border-radius: 4px; border: 1px solid #555; font-size: 11px; }
        .manual-launch-group select, .manual-launch-group input { font-size: 11px; padding: 2px 4px; }
        .manual-launch-group button { width: auto; padding: 3px 8px; margin: 0; font-size: 11px; background: #0077aa; border-color: #0099cc; }
        .manual-launch-group button:hover { background: #0088cc; }

        .sidebar { background: #333; padding: 10px; border-radius: 8px; width: 300px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
        .panel { background: #444; padding: 8px; border-radius: 6px; }
        .panel h3 { margin: 0 0 6px 0; font-size: 13px; border-bottom: 1px solid #666; padding-bottom: 2px; color: #44ffff; }
        .panel.ai-panel { border: 1px solid #00ffcc; }
        .panel.ai-panel h3 { color: #00ffcc; border-bottom-color: #008866; }
        
        .control-group { margin: 4px 0; display: flex; align-items: center; justify-content: space-between; }
        .control-group label { font-size: 11px; }
        input[type="number"], select { width: 70px; background: #222; color: #fff; border: 1px solid #666; padding: 2px; border-radius: 4px; font-size: 12px; }
        
        button { width: 100%; padding: 5px; margin-top: 4px; font-size: 12px; cursor: pointer; font-weight: bold; background: #555; color: #fff; border: 1px solid #777; border-radius: 4px; }
        button:hover { background: #666; }
        
        .square-btn-container { display: flex; gap: 8px; margin-bottom: 4px; }
        .square-btn {
            width: 100%; height: 42px; font-size: 11px; display: flex; align-items: center; justify-content: center; gap: 4px;
            background: #333; border: 2px solid #666; border-radius: 6px; cursor: pointer; user-select: none;
        }
        .square-btn.active-ball { background: #005588; border-color: #00ccff; color: #00ffff; box-shadow: 0 0 6px #00ccff; }
        .square-btn.active-box { background: #884400; border-color: #ff9900; color: #ffcc00; box-shadow: 0 0 6px #ff9900; }

        button.play-pause { background: #27ae60; border-color: #2ecc71; margin-bottom: 4px; font-size: 12px; }
        button.play-pause.paused { background: #e67e22; border-color: #f39c12; }

        button.ai { background: #008844; border-color: #00cc66; }
        button.reset-marker { background: #886600; border-color: #bb9900; margin-top: 4px; }
        .btn-reset-pos { background: #d35400; border-color: #e67e22; }
        .btn-reset-all { background: #a30000; border-color: #d60000; }
        button.btn-delete { background: #c0392b; border-color: #e74c3c; margin-top: 6px; }
        button.btn-delete:hover { background: #e74c3c; }
        
        .result-box { margin-top: 4px; font-size: 11px; color: #00ffcc; height: 95px; overflow-y: auto; background: #181818; padding: 4px; border-radius: 4px; border: 1px solid #333; line-height: 1.3; }
    </style>
</head>
<body>

    <h1>雛ちゃんブレイカー2nd 物理予測エディタ</h1>
    
    <div class="main-container">
        <div class="canvas-area">
            <canvas id="gameCanvas" width="920" height="500"></canvas>
            
            <div class="bottom-bar">
                <div class="reset-group">
                    <button class="btn-reset-pos" onclick="resetPositions()">配置リセット</button>
                    <button class="btn-reset-all" onclick="resetScene()">全リセット</button>
                </div>

                <div class="manual-launch-group">
                    <select id="manualType" onchange="updateManualAxisLabel()">
                        <option value="ball_left">左ボール</option>
                        <option value="ball_right">右ボール</option>
                        <option value="box">ボックス</option>
                    </select>
                    <span id="manualAxisLabel">Y:</span>
                    <input type="number" id="manualPosVal" value="250" style="width: 48px;">
                    <button onclick="launchFromManualUI()">発射</button>
                </div>

                <div id="modeHint" style="font-size: 11px; color: #fffa00; font-weight: bold;">
                    モード: ドラッグ移動
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>1. アクション & コントロール</h3>
                <button id="btnPlayPause" class="play-pause paused" onclick="togglePlayPause()">⏸ 物理停止中 (ドラッグ可)</button>
                
                <div class="square-btn-container">
                    <div id="btnModeBall" class="square-btn" onclick="setActionMode('ball')">
                        <span>🔵</span>ボール
                    </div>
                    <div id="btnModeBox" class="square-btn" onclick="setActionMode('box')">
                        <span>🟧</span>ボックス
                    </div>
                </div>
            </div>

            <div class="panel ai-panel">
                <h3>🤖 自動探索 (最大5ターン)</h3>
                <div class="control-group">
                    <label>探索対象:</label>
                    <select id="searchTarget">
                        <option value="all">全項目 (ボール＋ボックス)</option>
                        <option value="ball_both">ボール (左右)</option>
                        <option value="ball_left">ボール (左)</option>
                        <option value="ball_right">ボール (右)</option>
                        <option value="box">ボックス (上空)</option>
                    </select>
                </div>
                <button class="ai" onclick="runAutoSearch()">自動探索を実行</button>
                <button class="reset-marker" onclick="clearMarkers()">マーカー表示クリア</button>
                <div id="searchResult" class="result-box">探索結果がここに表示されます</div>
            </div>

            <div class="panel">
                <h3>2. オブジェクト追加</h3>
                <div class="control-group">
                    <label>種類:</label>
                    <select id="objType" style="width: 130px;" onchange="onObjTypeChange()">
                        <option value="dynamic">動く(柱等)</option>
                        <option value="static">固定(床等)</option>
                        <option value="green_pass">投擲物すり抜け(緑)</option>
                        <option value="purple_pass">雛すり抜け(紫)</option>
                        <option value="preset_tree">🌲 木(動的)</option>
                        <option value="preset_snowman">☃️ 雪だるま(動的)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>初期X / Y:</label>
                    <div>
                        <input type="number" id="newX" value="460" style="width:32px;">
                        <input type="number" id="newY" value="100" style="width:32px;">
                    </div>
                </div>
                <div class="control-group">
                    <label>幅W / 高H / 角度:</label>
                    <div>
                        <input type="number" id="newW" value="180" style="width:32px;">
                        <input type="number" id="newH" value="20" style="width:32px;">
                        <input type="number" id="newAngle" value="0" style="width:32px;">
                    </div>
                </div>
                <button onclick="addObjectFromUI()">オブジェクト追加</button>
            </div>

            <div class="panel">
                <h3>3. 選択情報 & 角度変更</h3>
                <div class="control-group">
                    <label>名前:</label>
                    <span id="selectedName" style="font-size:11px; color:#fffa00;">なし</span>
                </div>
                <div class="control-group">
                    <label>現在X / Y:</label>
                    <div>
                        <input type="number" id="selectedX" readonly style="background:#333; color:#aaa; width:32px;">
                        <input type="number" id="selectedY" readonly style="background:#333; color:#aaa; width:32px;">
                    </div>
                </div>
                <div class="control-group">
                    <label>角度 (deg):</label>
                    <input type="number" id="selectedAngle" value="0" style="width:60px;" oninput="updateSelectedAngle()">
                </div>
                <button class="btn-delete" onclick="deleteSelectedObject()">選択オブジェクトを削除</button>
            </div>
        </div>
    </div>

<script>
const PPU = 75; 
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CATEGORY_STATIC     = 0x0001; 
const CATEGORY_HINA       = 0x0002; 
const CATEGORY_PROJECTILE = 0x0004; 
const CATEGORY_DYNAMIC    = 0x0008; 
const CATEGORY_GREEN      = 0x0010; 
const CATEGORY_PURPLE     = 0x0020; 

const BALL_RADIUS_M = 0.22;
const BALL_RADIUS_PX = BALL_RADIUS_M * PPU;
const BOX_SIZE_M = 0.6;
const BOX_HALF_PX = (BOX_SIZE_M * PPU) / 2;

let world;
let hinaData = { x: 460, y: 200, angle: 0, w: 22.5, h: 52.5 };
let customObjects = [];
let isPlaying = false; 
let spawnedBodies = [];
let hinaBodyRef = null;

let currentActionMode = 'drag';
let rawSearchResults = { ball_left: [], ball_right: [], box: [] };

let isDragging = false;
let draggedTarget = null;

function degToRad(deg) { return deg * Math.PI / 180; }
function radToDeg(rad) { return Math.round(rad * 180 / Math.PI); }

function initScene() {
    spawnedBodies = [];
    isPlaying = false;
    updatePlayPauseButton();
    buildPhysicsWorld(false); 
}

function buildPhysicsWorld(isFullSimulation) {
    world = new planck.World(planck.Vec2(0.0, -9.81));

    // 🎎 雛ちゃん
    const hinaBodyType = isFullSimulation ? 'dynamic' : 'static';
    hinaBodyRef = world.createBody({
        type: hinaBodyType,
        position: planck.Vec2(hinaData.x / PPU, hinaData.y / PPU),
        angle: hinaData.angle,
        linearDrag: 0.0,
        angularDrag: 0.05,
        gravityScale: 0.8
    });
    
    const hinaMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_PROJECTILE | CATEGORY_GREEN;
    hinaBodyRef.createFixture(planck.Box(0.3 / 2, 0.7 / 2, planck.Vec2(0, -0.02)), { 
        density: 3.81,
        friction: 0.4, 
        restitution: 0.2,
        filterCategoryBits: CATEGORY_HINA,
        filterMaskBits: hinaMask
    });
    hinaBodyRef.setUserData({ id: 'hina' });

    // 各種ブロック
    customObjects.forEach((obj, index) => {
        const isDynamic = (obj.type === 'dynamic' || obj.type === 'preset_tree' || obj.type === 'preset_snowman');
        const bType = (isFullSimulation && isDynamic) ? 'dynamic' : 'static';
        
        const body = world.createBody({
            type: bType,
            position: planck.Vec2(obj.x / PPU, obj.y / PPU),
            angle: obj.angle,
            angularDrag: 1.0
        });

        let catBits = CATEGORY_STATIC;
        let maskBits = 0xFFFF;

        if (isDynamic) {
            catBits = CATEGORY_DYNAMIC;
            maskBits = 0xFFFF;
        } else if (obj.type === 'static') {
            catBits = CATEGORY_STATIC;
            maskBits = 0xFFFF;
        } else if (obj.type === 'green_pass') {
            catBits = CATEGORY_GREEN;
            maskBits = CATEGORY_HINA | CATEGORY_DYNAMIC;
        } else if (obj.type === 'purple_pass') {
            catBits = CATEGORY_PURPLE;
            maskBits = CATEGORY_PROJECTILE | CATEGORY_DYNAMIC;
        }

        body.createFixture(planck.Box((obj.w / PPU) / 2, (obj.h / PPU) / 2), {
            density: isDynamic ? 2.0 : 0.0,
            friction: 0.5,
            restitution: 0.2,
            filterCategoryBits: catBits,
            filterMaskBits: maskBits
        });
        body.setUserData({ id: 'custom', index: index });
    });
}

function setBodiesMotionState(enable) {
    if (!world) return;
    for (let b = world.getBodyList(); b; b = b.getNext()) {
        const uData = b.getUserData() || {};
        
        let isTarget = false;
        if (uData.id === 'hina') {
            isTarget = true;
        } else if (uData.id === 'custom') {
            const obj = customObjects[uData.index];
            if (obj && (obj.type === 'dynamic' || obj.type === 'preset_tree' || obj.type === 'preset_snowman')) {
                isTarget = true;
            }
        } else if (uData.id === 'projectile') {
            isTarget = true;
        }

        if (isTarget) {
            if (enable) {
                b.setType('dynamic');
                if (uData.savedVel) {
                    b.setLinearVelocity(uData.savedVel);
                    b.setAngularVelocity(uData.savedAngVel);
                }
            } else {
                uData.savedVel = b.getLinearVelocity().clone();
                uData.savedAngVel = b.getAngularVelocity();
                b.setUserData(uData);
                b.setType('static');
            }
        }
    }
}

function togglePlayPause() {
    isPlaying = !isPlaying;
    setBodiesMotionState(isPlaying);
    updatePlayPauseButton();
}

function updatePlayPauseButton() {
    const btn = document.getElementById('btnPlayPause');
    if (isPlaying) {
        btn.classList.remove('paused');
        btn.innerText = "▶ 物理動作中 (タップで停止)";
    } else {
        btn.classList.add('paused');
        btn.innerText = "⏸ 物理停止中 (ドラッグ可)";
    }
}

function setActionMode(mode) {
    if (currentActionMode === mode) {
        currentActionMode = 'drag';
    } else {
        currentActionMode = mode;
    }

    const btnBall = document.getElementById('btnModeBall');
    const btnBox = document.getElementById('btnModeBox');
    const hint = document.getElementById('modeHint');

    btnBall.classList.remove('active-ball');
    btnBox.classList.remove('active-box');

    if (currentActionMode === 'ball') {
        btnBall.classList.add('active-ball');
        hint.innerText = "モード: ボール発射";
    } else if (currentActionMode === 'box') {
        btnBox.classList.add('active-box');
        hint.innerText = "モード: ボックス落下";
    } else {
        hint.innerText = "モード: ドラッグ移動";
    }
}

function updateManualAxisLabel() {
    const type = document.getElementById('manualType').value;
    const label = document.getElementById('manualAxisLabel');
    label.innerText = (type === 'box') ? 'X:' : 'Y:';
}

function launchFromManualUI() {
    const type = document.getElementById('manualType').value;
    const val = parseFloat(document.getElementById('manualPosVal').value) || 0;

    if (type === 'ball_left') fireBallAtY(val, true);
    else if (type === 'ball_right') fireBallAtY(val, false);
    else if (type === 'box') dropBoxAtX(val);
}

function fireBallAtY(targetY, isLeft) {
    if (!isPlaying) {
        isPlaying = true;
        setBodiesMotionState(true);
        updatePlayPauseButton();
    }

    const launchX_px = isLeft ? -BALL_RADIUS_PX : (920 + BALL_RADIUS_PX);

    const ball = world.createBody({
        type: 'dynamic',
        position: planck.Vec2(launchX_px / PPU, targetY / PPU),
        linearDrag: 0.0,
        angularDrag: 10.0,
        gravityScale: 1.0
    });

    const projMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_HINA | CATEGORY_PURPLE;
    ball.createFixture(planck.Circle(BALL_RADIUS_M), { 
        density: 6.58,
        friction: 0.2, 
        restitution: 0.5,
        filterCategoryBits: CATEGORY_PROJECTILE,
        filterMaskBits: projMask
    });

    const velocityX = isLeft ? 20.0 : -20.0;
    ball.setLinearVelocity(planck.Vec2(velocityX, -1.0));
    ball.setUserData({ id: 'projectile' });

    spawnedBodies.push({ body: ball, type: 'ball' });
    setActionMode('drag');
}

function dropBoxAtX(targetX) {
    if (!isPlaying) {
        isPlaying = true;
        setBodiesMotionState(true);
        updatePlayPauseButton();
    }

    const box = world.createBody({
        type: 'dynamic',
        position: planck.Vec2(targetX / PPU, (500 + BOX_HALF_PX) / PPU),
        linearDrag: 0.0,
        angularDrag: 10.0,
        gravityScale: 0.8
    });

    const projMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_HINA | CATEGORY_PURPLE;
    box.createFixture(planck.Box(BOX_SIZE_M / 2, BOX_SIZE_M / 2), {
        density: 8.33,
        friction: 0.5,
        restitution: 0.1,
        filterCategoryBits: CATEGORY_PROJECTILE,
        filterMaskBits: projMask
    });
    box.setUserData({ id: 'projectile' });

    spawnedBodies.push({ body: box, type: 'box' });
    setActionMode('drag');
}

function resetPositions() {
    spawnedBodies = [];
    isPlaying = false;
    updatePlayPauseButton();
    buildPhysicsWorld(false);
}

function resetScene() {
    customObjects = [];
    hinaData = { x: 460, y: 200, angle: 0, w: 22.5, h: 52.5 };
    clearMarkers();
    clearSelectionUI();
    initScene();
}

function deleteSelectedObject() {
    if (draggedTarget === null) return;
    if (draggedTarget === 'hina') {
        alert("雛ちゃんは削除できません。");
        return;
    }
    if (typeof draggedTarget === 'number' && customObjects[draggedTarget]) {
        customObjects.splice(draggedTarget, 1);
        clearSelectionUI();
        initScene();
    }
}

function clearSelectionUI() {
    draggedTarget = null;
    document.getElementById('selectedName').innerText = "なし";
    document.getElementById('selectedX').value = "";
    document.getElementById('selectedY').value = "";
    document.getElementById('selectedAngle').value = "0";
}

function createSimEnvironment() {
    let simWorld = new planck.World(planck.Vec2(0.0, -9.81));

    let simHina = simWorld.createBody({
        type: 'dynamic',
        position: planck.Vec2(hinaData.x / PPU, hinaData.y / PPU),
        angle: hinaData.angle,
        linearDrag: 0.0,
        angularDrag: 0.05,
        gravityScale: 0.8
    });
    const hinaMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_PROJECTILE | CATEGORY_GREEN;
    simHina.createFixture(planck.Box(0.3 / 2, 0.7 / 2, planck.Vec2(0, -0.02)), { 
        density: 3.81, friction: 0.4, restitution: 0.2,
        filterCategoryBits: CATEGORY_HINA, filterMaskBits: hinaMask
    });

    let simObjects = customObjects.map(obj => {
        const isDynamic = (obj.type === 'dynamic' || obj.type === 'preset_tree' || obj.type === 'preset_snowman');
        let b = simWorld.createBody({
            type: isDynamic ? 'dynamic' : 'static',
            position: planck.Vec2(obj.x / PPU, obj.y / PPU),
            angle: obj.angle,
            angularDrag: 1.0
        });

        let catBits = CATEGORY_STATIC;
        let maskBits = 0xFFFF;
        if (isDynamic) { catBits = CATEGORY_DYNAMIC; }
        else if (obj.type === 'green_pass') { catBits = CATEGORY_GREEN; maskBits = CATEGORY_HINA | CATEGORY_DYNAMIC; }
        else if (obj.type === 'purple_pass') { catBits = CATEGORY_PURPLE; maskBits = CATEGORY_PROJECTILE | CATEGORY_DYNAMIC; }

        b.createFixture(planck.Box((obj.w / PPU) / 2, (obj.h / PPU) / 2), { 
            density: isDynamic ? 2.0 : 0.0,
            friction: 0.5, restitution: 0.2,
            filterCategoryBits: catBits, filterMaskBits: maskBits
        });
        return { body: b, initX: obj.x / PPU, initY: obj.y / PPU, initAngle: obj.angle };
    });

    return { simWorld, simHina, simObjects };
}

function resetSimEnvironment(env) {
    env.simHina.setPosition(planck.Vec2(hinaData.x / PPU, hinaData.y / PPU));
    env.simHina.setAngle(hinaData.angle);
    env.simHina.setLinearVelocity(planck.Vec2(0, 0));
    env.simHina.setAngularVelocity(0);
    env.simHina.setAwake(true);

    env.simObjects.forEach(item => {
        item.body.setPosition(planck.Vec2(item.initX, item.initY));
        item.body.setAngle(item.initAngle);
        item.body.setLinearVelocity(planck.Vec2(0, 0));
        item.body.setAngularVelocity(0);
        item.body.setAwake(true);
    });
}

function runAutoSearch() {
    const target = document.getElementById('searchTarget').value;
    rawSearchResults = { ball_left: [], ball_right: [], box: [] };

    const simEnv = createSimEnvironment();

    // 2段階探索 (ワンキルが無い時だけ1px刻みで精密探索)
    if (target === 'all' || target === 'ball_both' || target === 'ball_left') {
        let foundOneKill = false;
        for (let y = 0; y <= 500; y += 4) {
            const turns = simulateKillTurnsFast(simEnv, 'ball', { isLeft: true, y: y });
            if (turns === 1) foundOneKill = true;
            if (turns > 0) rawSearchResults.ball_left.push({ val: y, turns: turns });
        }
        if (!foundOneKill) {
            rawSearchResults.ball_left = [];
            for (let y = 0; y <= 500; y += 1) {
                const turns = simulateKillTurnsFast(simEnv, 'ball', { isLeft: true, y: y });
                if (turns > 0) rawSearchResults.ball_left.push({ val: y, turns: turns });
            }
        }
    }

    if (target === 'all' || target === 'ball_both' || target === 'ball_right') {
        let foundOneKill = false;
        for (let y = 0; y <= 500; y += 4) {
            const turns = simulateKillTurnsFast(simEnv, 'ball', { isLeft: false, y: y });
            if (turns === 1) foundOneKill = true;
            if (turns > 0) rawSearchResults.ball_right.push({ val: y, turns: turns });
        }
        if (!foundOneKill) {
            rawSearchResults.ball_right = [];
            for (let y = 0; y <= 500; y += 1) {
                const turns = simulateKillTurnsFast(simEnv, 'ball', { isLeft: false, y: y });
                if (turns > 0) rawSearchResults.ball_right.push({ val: y, turns: turns });
            }
        }
    }

    if (target === 'all' || target === 'box') {
        let foundOneKill = false;
        for (let x = 0; x <= 920; x += 8) {
            const turns = simulateKillTurnsFast(simEnv, 'box', { x: x });
            if (turns === 1) foundOneKill = true;
            if (turns > 0) rawSearchResults.box.push({ val: x, turns: turns });
        }
        if (!foundOneKill) {
            rawSearchResults.box = [];
            for (let x = 0; x <= 920; x += 2) {
                const turns = simulateKillTurnsFast(simEnv, 'box', { x: x });
                if (turns > 0) rawSearchResults.box.push({ val: x, turns: turns });
            }
        }
    }

    displaySearchResults(rawSearchResults);
}

function simulateKillTurnsFast(env, type, params) {
    resetSimEnvironment(env);
    const { simWorld, simHina } = env;
    const projMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_HINA | CATEGORY_PURPLE;

    let activeProjectiles = [];
    let killTurn = 0;

    for (let turn = 1; turn <= 5; turn++) {
        let pBody = null;
        if (type === 'ball') {
            const launchX = params.isLeft ? -BALL_RADIUS_PX : (920 + BALL_RADIUS_PX);
            pBody = simWorld.createBody({
                type: 'dynamic',
                position: planck.Vec2(launchX / PPU, params.y / PPU),
                angularDrag: 10.0,
                gravityScale: 1.0
            });
            pBody.createFixture(planck.Circle(BALL_RADIUS_M), { 
                density: 6.58, friction: 0.2, restitution: 0.5,
                filterCategoryBits: CATEGORY_PROJECTILE, filterMaskBits: projMask 
            });
            pBody.setLinearVelocity(planck.Vec2(params.isLeft ? 20.0 : -20.0, -1.0));
        } else if (type === 'box') {
            pBody = simWorld.createBody({
                type: 'dynamic',
                position: planck.Vec2(params.x / PPU, (500 + BOX_HALF_PX) / PPU),
                angularDrag: 10.0,
                gravityScale: 0.8
            });
            pBody.createFixture(planck.Box(BOX_SIZE_M / 2, BOX_SIZE_M / 2), { 
                density: 8.33, friction: 0.5, restitution: 0.1,
                filterCategoryBits: CATEGORY_PROJECTILE, filterMaskBits: projMask
            });
        }
        activeProjectiles.push(pBody);

        for (let f = 0; f < 300; f++) {
            simWorld.step(1 / 60);
            let hPos = simHina.getPosition();
            if (hPos.y < 0) {
                killTurn = turn;
                break;
            }
        }

        if (killTurn > 0) break;
    }

    activeProjectiles.forEach(b => simWorld.destroyBody(b));
    return killTurn;
}

function getGroupedRanges(items, step) {
    if (items.length === 0) return [];
    
    let byTurns = {};
    items.forEach(item => {
        if (!byTurns[item.turns]) byTurns[item.turns] = [];
        byTurns[item.turns].push(item.val);
    });

    let results = [];
    Object.keys(byTurns).forEach(t => {
        let arr = byTurns[t];
        let start = arr[0];
        let prev = arr[0];

        for (let i = 1; i < arr.length; i++) {
            if (arr[i] === prev + step) {
                prev = arr[i];
            } else {
                results.push({ start, end: prev, turns: parseInt(t) });
                start = arr[i];
                prev = arr[i];
            }
        }
        results.push({ start, end: prev, turns: parseInt(t) });
    });

    return results;
}

function displaySearchResults(raw) {
    const resDiv = document.getElementById('searchResult');
    let html = '';

    const formatLine = (r, axis) => {
        const turnStr = (r.turns === 1) ? '' : ` (${r.turns}ターン)`;
        if (r.start === r.end) {
            return `${axis} ${r.start}px${turnStr}`;
        } else {
            return `${axis} ${r.start}〜${r.end}px (範囲:${r.end - r.start + (axis==='X'?2:1)}px)${turnStr}`;
        }
    };

    const leftStep = (raw.ball_left.length > 0 && raw.ball_left[0].val % 4 === 0) ? 4 : 1;
    const leftRanges = getGroupedRanges(raw.ball_left, leftStep);
    if (leftRanges.length > 0) html += `<strong>【左ボール】</strong><br>` + leftRanges.map(r => formatLine(r, 'Y')).join('<br>') + '<br>';

    const rightStep = (raw.ball_right.length > 0 && raw.ball_right[0].val % 4 === 0) ? 4 : 1;
    const rightRanges = getGroupedRanges(raw.ball_right, rightStep);
    if (rightRanges.length > 0) html += `<strong>【右ボール】</strong><br>` + rightRanges.map(r => formatLine(r, 'Y')).join('<br>') + '<br>';

    const boxStep = (raw.box.length > 0 && raw.box[0].val % 8 === 0) ? 8 : 2;
    const boxRanges = getGroupedRanges(raw.box, boxStep);
    if (boxRanges.length > 0) html += `<strong>【上空ボックス】</strong><br>` + boxRanges.map(r => formatLine(r, 'X')).join('<br>') + '<br>';

    resDiv.innerHTML = html || '5ターン以内に成功する場所が見つかりませんでした。';
}

function clearMarkers() {
    rawSearchResults = { ball_left: [], ball_right: [], box: [] };
    document.getElementById('searchResult').innerText = "探索結果がここに表示されます";
}

function onObjTypeChange() {
    const type = document.getElementById('objType').value;
    const wInput = document.getElementById('newW');
    const hInput = document.getElementById('newH');

    if (type === 'preset_tree') {
        wInput.value = 45; hInput.value = 90;
    } else if (type === 'preset_snowman') {
        wInput.value = 50; hInput.value = 75;
    }
}

function addObjectFromUI() {
    const type = document.getElementById('objType').value;
    const x = parseFloat(document.getElementById('newX').value);
    const y = parseFloat(document.getElementById('newY').value);
    const w = parseFloat(document.getElementById('newW').value);
    const h = parseFloat(document.getElementById('newH').value);
    const angleDeg = parseFloat(document.getElementById('newAngle').value) || 0;

    customObjects.push({ type, x, y, w, h, angle: degToRad(angleDeg) });
    initScene();
}

function updateSelectedAngle() {
    if (draggedTarget === null) return;
    const deg = parseFloat(document.getElementById('selectedAngle').value) || 0;
    const rad = degToRad(deg);

    if (draggedTarget === 'hina') hinaData.angle = rad;
    else if (typeof draggedTarget === 'number' && customObjects[draggedTarget]) customObjects[draggedTarget].angle = rad;
    
    buildPhysicsWorld(false);
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: canvas.height - (clientY - rect.top) };
}

function isPointInsideRotatedBox(px, py, obj) {
    const dx = px - obj.x;
    const dy = py - obj.y;

    const rad = obj.angle || 0;
    const cos = Math.cos(-rad);
    const sin = Math.sin(-rad);

    const localX = dx * cos - dy * sin;
    const localY = dx * sin + dy * cos;

    return (Math.abs(localX) <= obj.w / 2 && Math.abs(localY) <= obj.h / 2);
}

function handleStart(e) {
    if (e.type === 'touchstart') e.preventDefault();
    const mouse = getPointerPos(e);

    if (currentActionMode === 'ball') {
        const isLeft = (mouse.x < canvas.width / 2);
        fireBallAtY(Math.round(mouse.y), isLeft);
        return;
    }

    if (currentActionMode === 'box') {
        dropBoxAtX(Math.round(mouse.x));
        return;
    }

    if (isPlaying) return;

    if (isPointInsideRotatedBox(mouse.x, mouse.y, hinaData)) {
        isDragging = true;
        draggedTarget = 'hina';
        updateUISelection("雛ちゃん", hinaData.x, hinaData.y, hinaData.angle);
        return;
    }

    for (let i = customObjects.length - 1; i >= 0; i--) {
        const obj = customObjects[i];
        if (isPointInsideRotatedBox(mouse.x, mouse.y, obj)) {
            isDragging = true;
            draggedTarget = i;
            let label = 'ブロック[' + i + ']';
            if (obj.type === 'static') label = '固定ブロック[' + i + ']';
            if (obj.type === 'dynamic') label = '動くブロック[' + i + ']';
            if (obj.type === 'green_pass') label = '投擲物透過(緑)[' + i + ']';
            if (obj.type === 'purple_pass') label = '雛透過(紫)[' + i + ']';
            if (obj.type === 'preset_tree') label = '🌲 木[' + i + ']';
            if (obj.type === 'preset_snowman') label = '☃️ 雪だるま[' + i + ']';

            updateUISelection(label, obj.x, obj.y, obj.angle);
            return;
        }
    }
}

function handleMove(e) {
    if (!isDragging || currentActionMode !== 'drag' || isPlaying) return;
    if (e.type === 'touchmove') e.preventDefault();

    const mouse = getPointerPos(e);
    if (draggedTarget === 'hina') {
        hinaData.x = Math.round(mouse.x);
        hinaData.y = Math.round(mouse.y);
        updateUISelection("雛ちゃん", hinaData.x, hinaData.y, hinaData.angle);
    } else if (typeof draggedTarget === 'number') {
        customObjects[draggedTarget].x = Math.round(mouse.x);
        customObjects[draggedTarget].y = Math.round(mouse.y);
        const obj = customObjects[draggedTarget];
        let label = 'ブロック[' + draggedTarget + ']';
        if (obj.type === 'static') label = '固定ブロック[' + draggedTarget + ']';
        if (obj.type === 'dynamic') label = '動くブロック[' + draggedTarget + ']';
        if (obj.type === 'green_pass') label = '投擲物透過(緑)[' + draggedTarget + ']';
        if (obj.type === 'purple_pass') label = '雛透過(紫)[' + draggedTarget + ']';
        if (obj.type === 'preset_tree') label = '🌲 木[' + draggedTarget + ']';
        if (obj.type === 'preset_snowman') label = '☃️ 雪だるま[' + draggedTarget + ']';

        updateUISelection(label, obj.x, obj.y, obj.angle);
    }
    buildPhysicsWorld(false);
}

function handleEnd() { isDragging = false; }

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);
canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
window.addEventListener('touchend', handleEnd);

function updateUISelection(name, x, y, radAngle) {
    document.getElementById('selectedName').innerText = name;
    document.getElementById('selectedX').value = x;
    document.getElementById('selectedY').value = y;
    document.getElementById('selectedAngle').value = radToDeg(radAngle || 0);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let b = world.getBodyList(); b; b = b.getNext()) {
        const uData = b.getUserData();
        const pos = b.getPosition();
        const angle = b.getAngle();
        ctx.save();
        ctx.translate(pos.x * PPU, canvas.height - (pos.y * PPU));
        ctx.rotate(-angle);

        if (uData && uData.id === 'hina') {
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-(0.3 * PPU) / 2, -(0.7 * PPU) / 2, 0.3 * PPU, 0.7 * PPU);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-(0.3 * PPU) / 4, (0.7 * PPU) / 4, 0.15 * PPU, 0.1 * PPU);
        } else if (uData && uData.id === 'custom') {
            const obj = customObjects[uData.index];
            if (obj) {
                if (obj.type === 'static') {
                    ctx.fillStyle = '#777777';
                    ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h);
                } else if (obj.type === 'dynamic') {
                    ctx.fillStyle = '#44aa44';
                    ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h);
                } else if (obj.type === 'green_pass') {
                    ctx.fillStyle = 'rgba(0, 255, 100, 0.4)';
                    ctx.strokeStyle = '#00ff66';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h);
                    ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h);
                } else if (obj.type === 'purple_pass') {
                    ctx.fillStyle = 'rgba(180, 0, 255, 0.4)';
                    ctx.strokeStyle = '#cc00ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h);
                    ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h);
                } else if (obj.type === 'preset_tree') {
                    ctx.fillStyle = '#228b22';
                    ctx.beginPath();
                    ctx.moveTo(0, -obj.h / 2);
                    ctx.lineTo(-obj.w / 2, obj.h / 2);
                    ctx.lineTo(obj.w / 2, obj.h / 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.fillStyle = '#8b4513';
                    ctx.fillRect(-obj.w / 6, obj.h / 4, obj.w / 3, obj.h / 4);
                } else if (obj.type === 'preset_snowman') {
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(0, obj.h / 6, obj.w / 2.5, 0, Math.PI * 2);
                    ctx.arc(0, -obj.h / 4, obj.w / 3.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
        ctx.restore();
    }

    spawnedBodies.forEach(item => {
        const pos = item.body.getPosition();
        ctx.save();
        ctx.translate(pos.x * PPU, canvas.height - (pos.y * PPU));
        
        if (item.type === 'ball') {
            ctx.beginPath();
            ctx.arc(0, 0, BALL_RADIUS_PX, 0, 2 * Math.PI);
            ctx.fillStyle = '#44ffff';
            ctx.fill();
        } else if (item.type === 'box') {
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(-BOX_HALF_PX, -BOX_HALF_PX, BOX_HALF_PX * 2, BOX_HALF_PX * 2);
        }
        ctx.restore();
    });

    rawSearchResults.ball_left.forEach(item => {
        ctx.fillStyle = (item.turns === 1) ? '#ffff00' : '#aa00ff';
        ctx.beginPath();
        ctx.arc(0, canvas.height - item.val, 5, 0, 2 * Math.PI);
        ctx.fill();
    });

    rawSearchResults.ball_right.forEach(item => {
        ctx.fillStyle = (item.turns === 1) ? '#ffff00' : '#aa00ff';
        ctx.beginPath();
        ctx.arc(920, canvas.height - item.val, 5, 0, 2 * Math.PI);
        ctx.fill();
    });

    const boxStep = (rawSearchResults.box.length > 0 && rawSearchResults.box[0].val % 8 === 0) ? 8 : 2;
    const boxRanges = getGroupedRanges(rawSearchResults.box, boxStep);
    ctx.lineWidth = 6;
    boxRanges.forEach(r => {
        ctx.strokeStyle = (r.turns === 1) ? '#ffff00' : '#aa00ff';
        ctx.beginPath();
        ctx.moveTo(r.start, canvas.height - 500);
        ctx.lineTo(r.end + 8, canvas.height - 500);
        ctx.stroke();
    });
}

function animate() {
    if (isPlaying) {
        world.step(1 / 60);

        if (hinaBodyRef) {
            const hPos = hinaBodyRef.getPosition();
            if (hPos.y < 0) {
                resetPositions();
            }
        }
    }
    draw();
    requestAnimationFrame(animate);
}

initScene();
animate();
</script>
</body>
</html>
