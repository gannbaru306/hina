<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>雛ブレ2nd 物理予測エディタ</title>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.27/dist/planck.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; background: #222; color: #fff; }
        
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
        h1 { margin: 0 0 4px 0; font-size: 16px; text-align: center; }
        
        .main-container { display: flex; gap: 8px; width: 100%; max-width: 1240px; height: calc(100vh - 32px); justify-content: center; align-items: stretch; }
        
        /* 左側：キャンバスエリア ＆ 隣接コントロールバー */
        .canvas-area { display: flex; flex-direction: column; flex: 1; max-width: 920px; height: 100%; justify-content: space-between; }
        canvas { background: #111; border: 2px solid #555; display: block; cursor: crosshair; touch-action: none; width: 100%; height: auto; aspect-ratio: 920 / 500; max-height: calc(100vh - 110px); object-fit: contain; }
        
        /* キャンバス直下の統合コントロールバー */
        .attached-bar { display: flex; flex-direction: column; gap: 4px; background: #2a2a2a; padding: 6px; border: 1px solid #555; border-top: none; border-radius: 0 0 6px 6px; }
        .bar-row { display: flex; gap: 6px; align-items: center; justify-content: space-between; font-size: 11px; }

        .btn-group { display: flex; gap: 4px; align-items: center; }
        .btn-group button { width: auto; padding: 3px 8px; margin: 0; font-size: 10px; font-weight: bold; cursor: pointer; border-radius: 3px; border: 1px solid #777; background: #444; color: #fff; }
        .btn-group button:hover { background: #555; }

        button.btn-reset-pos { background: #d35400; border-color: #e67e22; }
        button.btn-reset-all { background: #a30000; border-color: #d60000; }
        button.play-pause { background: #27ae60; border-color: #2ecc71; }
        button.play-pause.paused { background: #e67e22; border-color: #f39c12; }

        .mode-btn { background: #333; border: 1px solid #666; padding: 3px 8px; font-size: 10px; border-radius: 3px; cursor: pointer; color: #ccc; }
        .mode-btn.active-ball { background: #005588; border-color: #00ccff; color: #00ffff; font-weight: bold; }
        .mode-btn.active-box { background: #884400; border-color: #ff9900; color: #ffcc00; font-weight: bold; }

        .manual-launch-group { display: flex; align-items: center; gap: 4px; background: #1a1a1a; padding: 2px 6px; border-radius: 4px; border: 1px solid #444; font-size: 10px; }
        .manual-launch-group select, .manual-launch-group input { font-size: 10px; padding: 1px 3px; background: #222; color: #fff; border: 1px solid #555; border-radius: 2px; }
        .manual-launch-group button { background: #0077aa; border-color: #0099cc; padding: 2px 6px; }
        .manual-launch-group button:disabled { background: #444; border-color: #555; color: #888; cursor: not-allowed; }

        .turn-badge { background: #111; color: #ffea00; font-weight: bold; padding: 2px 8px; border-radius: 3px; border: 1px solid #666; font-size: 11px; }

        /* 右側：サイドバーエリア (設定・探索専用) */
        .sidebar { background: #333; padding: 6px; border-radius: 6px; width: 300px; font-size: 11px; display: flex; flex-direction: column; gap: 6px; height: 100%; overflow-y: auto; }
        .panel { background: #444; padding: 6px; border-radius: 4px; }
        .panel h3 { margin: 0 0 4px 0; font-size: 11px; border-bottom: 1px solid #666; padding-bottom: 1px; color: #44ffff; }
        .panel.ai-panel { border: 1px solid #00ffcc; }
        .panel.ai-panel h3 { color: #00ffcc; border-bottom-color: #008866; }
        
        .control-group { margin: 2px 0; display: flex; align-items: center; justify-content: space-between; }
        .control-group label { font-size: 10px; }
        input[type="number"], select { width: 60px; background: #222; color: #fff; border: 1px solid #666; padding: 1px 3px; border-radius: 3px; font-size: 10px; }
        
        button.sidebar-btn { width: 100%; padding: 3px; margin-top: 2px; font-size: 10px; cursor: pointer; font-weight: bold; background: #555; color: #fff; border: 1px solid #777; border-radius: 3px; }
        button.sidebar-btn:hover { background: #666; }
        
        button.ai { background: #008844; border-color: #00cc66; }
        button.reset-marker { background: #886600; border-color: #bb9900; margin-top: 2px; }
        button.btn-delete { background: #c0392b; border-color: #e74c3c; margin-top: 2px; }
        
        .result-box { margin-top: 2px; font-size: 10px; color: #00ffcc; flex: 1; min-height: 80px; max-height: 180px; overflow-y: auto; background: #181818; padding: 4px; border-radius: 3px; border: 1px solid #333; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>雛ちゃんブレイカー2nd 物理予測エディタ</h1>
    
    <div class="main-container">
        <div class="canvas-area">
            <canvas id="gameCanvas" width="920" height="500"></canvas>
            
            <div class="attached-bar">
                <div class="bar-row">
                    <div class="btn-group">
                        <div id="turnInfo" class="turn-badge">Turn: 1</div>
                        <button id="btnPlayPause" class="play-pause paused" onclick="togglePlayPause()">⏸ 物理停止中</button>
                    </div>

                    <div class="btn-group">
                        <span style="font-size:10px; color:#aaa;">発射モード:</span>
                        <div id="btnModeBall" class="mode-btn" onclick="setActionMode('ball')">🔵 ボール</div>
                        <div id="btnModeBox" class="mode-btn" onclick="setActionMode('box')">🟧 ボックス</div>
                    </div>

                    <div class="btn-group">
                        <button class="btn-reset-pos" onclick="resetPositions()">配置リセット</button>
                        <button class="btn-reset-all" onclick="resetScene()">全リセット</button>
                    </div>
                </div>

                <div class="bar-row">
                    <div class="manual-launch-group">
                        <span style="color:#00ffcc; font-weight:bold;">手動指定発射:</span>
                        <select id="manualType" onchange="updateManualAxisLabel()">
                            <option value="ball_left">左ボール</option>
                            <option value="ball_right">右ボール</option>
                            <option value="box">ボックス</option>
                        </select>
                        <span id="manualAxisLabel">Y:</span>
                        <input type="number" id="manualPosVal" value="250" style="width: 42px;">
                        <button id="btnManualLaunch" onclick="launchFromManualUI()">発射</button>
                    </div>

                    <div id="modeHint" style="font-size: 10px; color: #fffa00; font-weight: bold;">
                        操作: ドラッグ移動モード
                    </div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="panel ai-panel" style="display: flex; flex-direction: column; flex: 1;">
                <h3>🤖 自動探索</h3>
                <div class="control-group">
                    <label>探索対象:</label>
                    <select id="searchTarget" style="width: 110px;">
                        <option value="all">全項目 (ボール＋ボックス)</option>
                        <option value="ball_both">ボール (左右)</option>
                        <option value="ball_left">ボール (左)</option>
                        <option value="ball_right">ボール (右)</option>
                        <option value="box">ボックス (上空)</option>
                    </select>
                </div>
                <button class="sidebar-btn ai" onclick="runAutoSearch()">自動探索を実行</button>
                <button class="sidebar-btn reset-marker" onclick="clearMarkers()">マーカー表示クリア</button>
                <div id="searchResult" class="result-box">探索結果がここに表示されます</div>
            </div>

            <div class="panel">
                <h3>📦 オブジェクト追加</h3>
                <div class="control-group">
                    <label>種類:</label>
                    <select id="objType" style="width: 110px;" onchange="onObjTypeChange()">
                        <option value="dynamic">動く(柱等)</option>
                        <option value="static">固定(床等)</option>
                        <option value="green_pass">投擲物すり抜け(緑)</option>
                        <option value="purple_pass">雛すり抜け(紫)</option>
                        <option value="preset_tree">🌲 木(動的)</option>
                        <option value="preset_snowman">☃️ 雪だるま(動的)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>初期X/Y:</label>
                    <div>
                        <input type="number" id="newX" value="460" style="width:28px;">
                        <input type="number" id="newY" value="100" style="width:28px;">
                    </div>
                </div>
                <div class="control-group">
                    <label>幅W/高H/角:</label>
                    <div>
                        <input type="number" id="newW" value="180" style="width:24px;">
                        <input type="number" id="newH" value="20" style="width:24px;">
                        <input type="number" id="newAngle" value="0" style="width:24px;">
                    </div>
                </div>
                <button class="sidebar-btn" onclick="addObjectFromUI()">オブジェクト追加</button>
            </div>

            <div class="panel">
                <h3>✏️ 選択オブジェクト設定</h3>
                <div class="control-group">
                    <label>名前:</label>
                    <span id="selectedName" style="font-size:10px; color:#fffa00;">なし</span>
                </div>
                <div class="control-group">
                    <label>現在X/Y:</label>
                    <div>
                        <input type="number" id="selectedX" readonly style="background:#333; color:#aaa; width:28px;">
                        <input type="number" id="selectedY" readonly style="background:#333; color:#aaa; width:28px;">
                    </div>
                </div>
                <div class="control-group">
                    <label>角度(deg):</label>
                    <input type="number" id="selectedAngle" value="0" style="width:50px;" oninput="updateSelectedAngle()">
                </div>
                <button class="sidebar-btn btn-delete" onclick="deleteSelectedObject()">選択削除</button>
            </div>
        </div>
    </div>

<script>
const PPU = 75; 
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const CATEGORY_STATIC     = 0x0001; 
const CATEGORY_HINA       = 0x0002; 
const CATEGORY_PROJECTILE = 0x0004; 
const CATEGORY_DYNAMIC    = 0x0008; 
const CATEGORY_GREEN      = 0x0010; 
const CATEGORY_PURPLE     = 0x0020; 

const BALL_RADIUS_M = 0.22;
const BALL_RADIUS_PX = BALL_RADIUS_M * PPU;
const BOX_SIZE_M = 0.6;
const BOX_HALF_PX = (BOX_SIZE_M * PPU) / 2;

let world;
let hinaData = { x: 460, y: 200, angle: 0, w: 22.5, h: 52.5 };
let customObjects = [];
let isPlaying = false; 
let spawnedBodies = [];
let hinaBodyRef = null;

let currentTurn = 1;
let isWaitingForSettlement = false;
let launchFrameCounter = 0;

let currentActionMode = 'drag';
let rawSearchResults = { ball_left: [], ball_right: [], box: [] };

let isDragging = false;
let draggedTarget = null;

function degToRad(deg) { return deg * Math.PI / 180; }
function radToDeg(rad) { return Math.round(rad * 180 / Math.PI); }

function updateTurnUI() {
    document.getElementById('turnInfo').innerText = `Turn: ${currentTurn}`;
}

function initScene() {
    spawnedBodies = [];
    isPlaying = false;
    isWaitingForSettlement = false;
    currentTurn = 1;
    updateTurnUI();
    updateLaunchButtonsState(true);
    updatePlayPauseButton();
    buildPhysicsWorld(false); 
}

function buildPhysicsWorld(isFullSimulation) {
    world = new planck.World(planck.Vec2(0.0, -9.81));

    const hinaBodyType = isFullSimulation ? 'dynamic' : 'static';
    hinaBodyRef = world.createBody({
        type: hinaBodyType,
        position: planck.Vec2(hinaData.x / PPU, hinaData.y / PPU),
        angle: hinaData.angle,
        linearDrag: 0.0,
        angularDrag: 0.05,
        gravityScale: 0.8
    });
    
    const hinaMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_PROJECTILE | CATEGORY_GREEN;
    hinaBodyRef.createFixture(planck.Box(0.3 / 2, 0.7 / 2, planck.Vec2(0, -0.02)), { 
        density: 3.81, friction: 0.4, restitution: 0.2,
        filterCategoryBits: CATEGORY_HINA, filterMaskBits: hinaMask
    });
    hinaBodyRef.setUserData({ id: 'hina' });

    customObjects.forEach((obj, index) => {
        const isDynamic = (obj.type === 'dynamic' || obj.type === 'preset_tree' || obj.type === 'preset_snowman');
        const bType = (isFullSimulation && isDynamic) ? 'dynamic' : 'static';
        
        const body = world.createBody({
            type: bType,
            position: planck.Vec2(obj.x / PPU, obj.y / PPU),
            angle: obj.angle,
            angularDrag: 1.0
        });

        let catBits = CATEGORY_STATIC;
        let maskBits = 0xFFFF;

        if (isDynamic) { catBits = CATEGORY_DYNAMIC; maskBits = 0xFFFF; }
        else if (obj.type === 'static') { catBits = CATEGORY_STATIC; maskBits = 0xFFFF; }
        else if (obj.type === 'green_pass') { catBits = CATEGORY_GREEN; maskBits = CATEGORY_HINA | CATEGORY_DYNAMIC; }
        else if (obj.type === 'purple_pass') { catBits = CATEGORY_PURPLE; maskBits = CATEGORY_PROJECTILE | CATEGORY_DYNAMIC; }

        body.createFixture(planck.Box((obj.w / PPU) / 2, (obj.h / PPU) / 2), {
            density: isDynamic ? 2.0 : 0.0, friction: 0.5, restitution: 0.2,
            filterCategoryBits: catBits, filterMaskBits: maskBits
        });
        body.setUserData({ id: 'custom', index: index });
    });
}

function setBodiesMotionState(enable) {
    if (!world) return;
    for (let b = world.getBodyList(); b; b = b.getNext()) {
        const uData = b.getUserData() || {};
        let isTarget = (uData.id === 'hina' || uData.id === 'projectile' || 
                       (uData.id === 'custom' && customObjects[uData.index] && 
                       (customObjects[uData.index].type === 'dynamic' || customObjects[uData.index].type === 'preset_tree' || customObjects[uData.index].type === 'preset_snowman')));

        if (isTarget) {
            if (enable) {
                b.setType('dynamic');
                if (uData.savedVel) {
                    b.setLinearVelocity(uData.savedVel);
                    b.setAngularVelocity(uData.savedAngVel);
                }
            } else {
                uData.savedVel = b.getLinearVelocity().clone();
                uData.savedAngVel = b.getAngularVelocity();
                b.setUserData(uData);
                b.setType('static');
            }
        }
    }
}

function togglePlayPause() {
    isPlaying = !isPlaying;
    setBodiesMotionState(isPlaying);
    
    // 手動で停止された時に発射待ちがあれば強制解除してターンを進める
    if (!isPlaying && isWaitingForSettlement) {
        isWaitingForSettlement = false;
        currentTurn++;
        updateTurnUI();
        updateLaunchButtonsState(true);
    }
    
    updatePlayPauseButton();
}

function updatePlayPauseButton() {
    const btn = document.getElementById('btnPlayPause');
    if (isPlaying) {
        btn.classList.remove('paused');
        btn.innerText = "▶ 物理動作中";
    } else {
        btn.classList.add('paused');
        btn.innerText = "⏸ 物理停止中";
    }
}

function setActionMode(mode) {
    currentActionMode = (currentActionMode === mode) ? 'drag' : mode;

    const btnBall = document.getElementById('btnModeBall');
    const btnBox = document.getElementById('btnModeBox');
    const hint = document.getElementById('modeHint');

    btnBall.classList.remove('active-ball');
    btnBox.classList.remove('active-box');

    if (currentActionMode === 'ball') {
        btnBall.classList.add('active-ball');
        hint.innerText = "操作: ボール発射モード";
    } else if (currentActionMode === 'box') {
        btnBox.classList.add('active-box');
        hint.innerText = "操作: ボックス落下モード";
    } else {
        hint.innerText = "操作: ドラッグ移動モード";
    }
}

function updateManualAxisLabel() {
    const type = document.getElementById('manualType').value;
    document.getElementById('manualAxisLabel').innerText = (type === 'box') ? 'X:' : 'Y:';
}

function updateLaunchButtonsState(enabled) {
    document.getElementById('btnManualLaunch').disabled = !enabled;
}

function launchFromManualUI() {
    if (isWaitingForSettlement) return;
    const type = document.getElementById('manualType').value;
    const val = parseFloat(document.getElementById('manualPosVal').value) || 0;

    if (type === 'ball_left') fireBallAtY(val, true);
    else if (type === 'ball_right') fireBallAtY(val, false);
    else if (type === 'box') dropBoxAtX(val);
}

function fireBallAtY(targetY, isLeft) {
    if (isWaitingForSettlement) return;
    if (!isPlaying) { isPlaying = true; setBodiesMotionState(true); updatePlayPauseButton(); }

    const launchX_px = isLeft ? -BALL_RADIUS_PX : (920 + BALL_RADIUS_PX);
    const ball = world.createBody({
        type: 'dynamic', position: planck.Vec2(launchX_px / PPU, targetY / PPU), angularDrag: 10.0, gravityScale: 1.0
    });

    const projMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_HINA | CATEGORY_PURPLE | CATEGORY_PROJECTILE;
    ball.createFixture(planck.Circle(BALL_RADIUS_M), { density: 6.58, friction: 0.2, restitution: 0.5, filterCategoryBits: CATEGORY_PROJECTILE, filterMaskBits: projMask });
    ball.setLinearVelocity(planck.Vec2(isLeft ? 20.0 : -20.0, -1.0));
    ball.setUserData({ id: 'projectile' });

    spawnedBodies.push({ body: ball, type: 'ball' });
    isWaitingForSettlement = true;
    launchFrameCounter = 0;
    updateLaunchButtonsState(false);
    setActionMode('drag');
}

function dropBoxAtX(targetX) {
    if (isWaitingForSettlement) return;
    if (!isPlaying) { isPlaying = true; setBodiesMotionState(true); updatePlayPauseButton(); }

    const box = world.createBody({
        type: 'dynamic', position: planck.Vec2(targetX / PPU, (500 + BOX_HALF_PX) / PPU), angularDrag: 10.0, gravityScale: 0.8
    });

    const projMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_HINA | CATEGORY_PURPLE | CATEGORY_PROJECTILE;
    box.createFixture(planck.Box(BOX_SIZE_M / 2, BOX_SIZE_M / 2), { density: 8.33, friction: 0.5, restitution: 0.1, filterCategoryBits: CATEGORY_PROJECTILE, filterMaskBits: projMask });
    box.setUserData({ id: 'projectile' });

    spawnedBodies.push({ body: box, type: 'box' });
    isWaitingForSettlement = true;
    launchFrameCounter = 0;
    updateLaunchButtonsState(false);
    setActionMode('drag');
}

function resetPositions() {
    spawnedBodies = [];
    isPlaying = false;
    isWaitingForSettlement = false;
    currentTurn = 1;
    updateTurnUI();
    updateLaunchButtonsState(true);
    updatePlayPauseButton();
    buildPhysicsWorld(false);
}

function resetScene() {
    customObjects = [];
    hinaData = { x: 460, y: 200, angle: 0, w: 22.5, h: 52.5 };
    clearMarkers();
    clearSelectionUI();
    initScene();
}

function deleteSelectedObject() {
    if (draggedTarget === null || draggedTarget === 'hina') return;
    if (typeof draggedTarget === 'number' && customObjects[draggedTarget]) {
        customObjects.splice(draggedTarget, 1);
        clearSelectionUI();
        initScene();
    }
}

function clearSelectionUI() {
    draggedTarget = null;
    document.getElementById('selectedName').innerText = "なし";
    document.getElementById('selectedX').value = "";
    document.getElementById('selectedY').value = "";
    document.getElementById('selectedAngle').value = "0";
}

function createSimEnvironment() {
    let simWorld = new planck.World(planck.Vec2(0.0, -9.81));
    let simHina = simWorld.createBody({
        type: 'dynamic', position: planck.Vec2(hinaData.x / PPU, hinaData.y / PPU), angle: hinaData.angle, angularDrag: 0.05, gravityScale: 0.8
    });
    const hinaMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_PROJECTILE | CATEGORY_GREEN;
    simHina.createFixture(planck.Box(0.3 / 2, 0.7 / 2, planck.Vec2(0, -0.02)), { density: 3.81, friction: 0.4, restitution: 0.2, filterCategoryBits: CATEGORY_HINA, filterMaskBits: hinaMask });

    let simObjects = customObjects.map(obj => {
        const isDynamic = (obj.type === 'dynamic' || obj.type === 'preset_tree' || obj.type === 'preset_snowman');
        let b = simWorld.createBody({ type: isDynamic ? 'dynamic' : 'static', position: planck.Vec2(obj.x / PPU, obj.y / PPU), angle: obj.angle, angularDrag: 1.0 });
        let catBits = isDynamic ? CATEGORY_DYNAMIC : (obj.type === 'green_pass' ? CATEGORY_GREEN : (obj.type === 'purple_pass' ? CATEGORY_PURPLE : CATEGORY_STATIC));
        let maskBits = (obj.type === 'green_pass') ? (CATEGORY_HINA | CATEGORY_DYNAMIC) : ((obj.type === 'purple_pass') ? (CATEGORY_PROJECTILE | CATEGORY_DYNAMIC) : 0xFFFF);
        b.createFixture(planck.Box((obj.w / PPU) / 2, (obj.h / PPU) / 2), { density: isDynamic ? 2.0 : 0.0, friction: 0.5, restitution: 0.2, filterCategoryBits: catBits, filterMaskBits: maskBits });
        return { body: b, initX: obj.x / PPU, initY: obj.y / PPU, initAngle: obj.angle };
    });

    return { simWorld, simHina, simObjects };
}

function resetSimEnvironment(env) {
    env.simHina.setPosition(planck.Vec2(hinaData.x / PPU, hinaData.y / PPU));
    env.simHina.setAngle(hinaData.angle);
    env.simHina.setLinearVelocity(planck.Vec2(0, 0));
    env.simHina.setAngularVelocity(0);
    env.simHina.setAwake(true);

    env.simObjects.forEach(item => {
        item.body.setPosition(planck.Vec2(item.initX, item.initY));
        item.body.setAngle(item.initAngle);
        item.body.setLinearVelocity(planck.Vec2(0, 0));
        item.body.setAngularVelocity(0);
        item.body.setAwake(true);
    });
}

function isWorldSettled(w) {
    for (let b = w.getBodyList(); b; b = b.getNext()) {
        if (b.getType() === 'dynamic') {
            if (b.getLinearVelocity().lengthSquared() > 0.005 || Math.abs(b.getAngularVelocity()) > 0.03) return false;
        }
    }
    return true;
}

function runAutoSearch() {
    const target = document.getElementById('searchTarget').value;
    rawSearchResults = { ball_left: [], ball_right: [], box: [] };
    const simEnv = createSimEnvironment();

    if (target === 'all' || target === 'ball_both' || target === 'ball_left') {
        let found = false;
        for (let y = 0; y <= 500; y += 4) {
            const res = simulateKillTurnsFast(simEnv, 'ball', { isLeft: true, y });
            if (res.turns === 1) found = true;
            if (res.turns > 0) rawSearchResults.ball_left.push({ val: y, turns: res.turns, steps: res.steps });
        }
        if (!found) {
            rawSearchResults.ball_left = [];
            for (let y = 0; y <= 500; y += 1) {
                const res = simulateKillTurnsFast(simEnv, 'ball', { isLeft: true, y });
                if (res.turns > 0) rawSearchResults.ball_left.push({ val: y, turns: res.turns, steps: res.steps });
            }
        }
    }

    if (target === 'all' || target === 'ball_both' || target === 'ball_right') {
        let found = false;
        for (let y = 0; y <= 500; y += 4) {
            const res = simulateKillTurnsFast(simEnv, 'ball', { isLeft: false, y });
            if (res.turns === 1) found = true;
            if (res.turns > 0) rawSearchResults.ball_right.push({ val: y, turns: res.turns, steps: res.steps });
        }
        if (!found) {
            rawSearchResults.ball_right = [];
            for (let y = 0; y <= 500; y += 1) {
                const res = simulateKillTurnsFast(simEnv, 'ball', { isLeft: false, y });
                if (res.turns > 0) rawSearchResults.ball_right.push({ val: y, turns: res.turns, steps: res.steps });
            }
        }
    }

    if (target === 'all' || target === 'box') {
        let found = false;
        for (let x = 0; x <= 920; x += 8) {
            const res = simulateKillTurnsFast(simEnv, 'box', { x });
            if (res.turns === 1) found = true;
            if (res.turns > 0) rawSearchResults.box.push({ val: x, turns: res.turns, steps: res.steps });
        }
        if (!found) {
            rawSearchResults.box = [];
            for (let x = 0; x <= 920; x += 2) {
                const res = simulateKillTurnsFast(simEnv, 'box', { x });
                if (res.turns > 0) rawSearchResults.box.push({ val: x, turns: res.turns, steps: res.steps });
            }
        }
    }

    displaySearchResults(rawSearchResults);
}

function simulateKillTurnsFast(env, type, params) {
    resetSimEnvironment(env);
    const { simWorld, simHina } = env;
    const projMask = CATEGORY_STATIC | CATEGORY_DYNAMIC | CATEGORY_HINA | CATEGORY_PURPLE | CATEGORY_PROJECTILE;

    let activeProjectiles = [];
    let killTurn = 0;
    let stepLog = [];

    for (let turn = 1; turn <= 5; turn++) {
        let pBody = null;
        let actionName = "";

        if (type === 'ball') {
            const launchX = params.isLeft ? -BALL_RADIUS_PX : (920 + BALL_RADIUS_PX);
            pBody = simWorld.createBody({ type: 'dynamic', position: planck.Vec2(launchX / PPU, params.y / PPU), angularDrag: 10.0, gravityScale: 1.0 });
            pBody.createFixture(planck.Circle(BALL_RADIUS_M), { density: 6.58, friction: 0.2, restitution: 0.5, filterCategoryBits: CATEGORY_PROJECTILE, filterMaskBits: projMask });
            pBody.setLinearVelocity(planck.Vec2(params.isLeft ? 20.0 : -20.0, -1.0));
            actionName = (params.isLeft ? "左" : "右") + "Y=" + params.y;
        } else if (type === 'box') {
            pBody = simWorld.createBody({ type: 'dynamic', position: planck.Vec2(params.x / PPU, (500 + BOX_HALF_PX) / PPU), angularDrag: 10.0, gravityScale: 0.8 });
            pBody.createFixture(planck.Box(BOX_SIZE_M / 2, BOX_SIZE_M / 2), { density: 8.33, friction: 0.5, restitution: 0.1, filterCategoryBits: CATEGORY_PROJECTILE, filterMaskBits: projMask });
            actionName = "上空X=" + params.x;
        }

        activeProjectiles.push(pBody);
        stepLog.push(actionName);

        let startHinaPos = simHina.getPosition().clone();
        let hinaMoved = false;

        for (let f = 0; f < 1800; f++) {
            simWorld.step(1 / 60);
            let hPos = simHina.getPosition();

            if (planck.Vec2.distance(startHinaPos, hPos) > 0.05) hinaMoved = true;
            if (hPos.y < 0) { killTurn = turn; break; }
            if (f > 120 && f % 5 === 0 && isWorldSettled(simWorld)) break;
        }

        if (killTurn > 0 || !hinaMoved) break;
    }

    activeProjectiles.forEach(b => simWorld.destroyBody(b));
    return { turns: killTurn, steps: stepLog };
}

function getGroupedRanges(items, step) {
    if (items.length === 0) return [];
    
    // 手数と手順（1手目、2手目...）が完全同一のものをグループ化
    let groups = [];
    
    items.forEach(item => {
        let stepKey = item.steps.join('->');
        let found = groups.find(g => g.key === stepKey);
        if (found) {
            found.items.push(item);
        } else {
            groups.push({ key: stepKey, turns: item.turns, steps: item.steps, items: [item] });
        }
    });

    let results = [];
    groups.forEach(g => {
        let arr = g.items;
        let start = arr[0].val, prev = arr[0].val;

        for (let i = 1; i < arr.length; i++) {
            if (arr[i].val === prev + step) {
                prev = arr[i].val;
            } else {
                results.push({ start, end: prev, turns: g.turns, steps: g.steps });
                start = arr[i].val; prev = arr[i].val;
            }
        }
        results.push({ start, end: prev, turns: g.turns, steps: g.steps });
    });

    return results;
}

function displaySearchResults(raw) {
    const resDiv = document.getElementById('searchResult');
    let html = '';

    const formatLine = (r, axis) => {
        if (r.turns === 1) {
            return (r.start === r.end) ? `${axis}=${r.start} ★ワンキル` : `${axis}=${r.start}〜${r.end} ★ワンキル`;
        } else {
            // 例: Y=23〜42 (3ターン) ↳ 左Y=30 → 右Y=82
            const rangeStr = (r.start === r.end) ? `${axis}=${r.start}` : `${axis}=${r.start}〜${r.end}`;
            const stepsStr = r.steps.slice(1).join(' → '); // 2手目以降を表記
            return `${rangeStr} (${r.turns}ターン)<br>&nbsp;&nbsp;↳ ${stepsStr}`;
        }
    };

    const leftStep = (raw.ball_left.length > 0 && raw.ball_left[0].val % 4 === 0) ? 4 : 1;
    const leftRanges = getGroupedRanges(raw.ball_left, leftStep);
    if (leftRanges.length > 0) html += `<strong>【左ボール】</strong><br>` + leftRanges.map(r => formatLine(r, 'Y')).join('<br>') + '<br>';

    const rightStep = (raw.ball_right.length > 0 && raw.ball_right[0].val % 4 === 0) ? 4 : 1;
    const rightRanges = getGroupedRanges(raw.ball_right, rightStep);
    if (rightRanges.length > 0) html += `<strong>【右ボール】</strong><br>` + rightRanges.map(r => formatLine(r, 'Y')).join('<br>') + '<br>';

    const boxStep = (raw.box.length > 0 && raw.box[0].val % 8 === 0) ? 8 : 2;
    const boxRanges = getGroupedRanges(raw.box, boxStep);
    if (boxRanges.length > 0) html += `<strong>【上空ボックス】</strong><br>` + boxRanges.map(r => formatLine(r, 'X')).join('<br>') + '<br>';

    resDiv.innerHTML = html || '5ターン以内に成功する場所が見つかりませんでした。';
}

function clearMarkers() {
    rawSearchResults = { ball_left: [], ball_right: [], box: [] };
    document.getElementById('searchResult').innerText = "探索結果がここに表示されます";
}

function onObjTypeChange() {
    const type = document.getElementById('objType').value;
    document.getElementById('newW').value = (type === 'preset_tree') ? 45 : ((type === 'preset_snowman') ? 50 : 180);
    document.getElementById('newH').value = (type === 'preset_tree') ? 90 : ((type === 'preset_snowman') ? 75 : 20);
}

function addObjectFromUI() {
    const type = document.getElementById('objType').value;
    const x = parseFloat(document.getElementById('newX').value);
    const y = parseFloat(document.getElementById('newY').value);
    const w = parseFloat(document.getElementById('newW').value);
    const h = parseFloat(document.getElementById('newH').value);
    const angleDeg = parseFloat(document.getElementById('newAngle').value) || 0;

    customObjects.push({ type, x, y, w, h, angle: degToRad(angleDeg) });
    initScene();
}

function updateSelectedAngle() {
    if (draggedTarget === null) return;
    const rad = degToRad(parseFloat(document.getElementById('selectedAngle').value) || 0);

    if (draggedTarget === 'hina') hinaData.angle = rad;
    else if (typeof draggedTarget === 'number' && customObjects[draggedTarget]) customObjects[draggedTarget].angle = rad;
    buildPhysicsWorld(false);
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: canvas.height - ((clientY - rect.top) * scaleY) };
}

function isPointInsideRotatedBox(px, py, obj) {
    const dx = px - obj.x, dy = py - obj.y;
    const rad = obj.angle || 0;
    const cos = Math.cos(-rad), sin = Math.sin(-rad);
    const localX = dx * cos - dy * sin, localY = dx * sin + dy * cos;
    return (Math.abs(localX) <= obj.w / 2 && Math.abs(localY) <= obj.h / 2);
}

function handleStart(e) {
    if (e.type === 'touchstart') e.preventDefault();
    const mouse = getPointerPos(e);

    if (currentActionMode === 'ball') {
        if (!isWaitingForSettlement) fireBallAtY(Math.round(mouse.y), mouse.x < canvas.width / 2);
        return;
    }
    if (currentActionMode === 'box') {
        if (!isWaitingForSettlement) dropBoxAtX(Math.round(mouse.x));
        return;
    }

    if (isPlaying) return;

    if (isPointInsideRotatedBox(mouse.x, mouse.y, hinaData)) {
        isDragging = true; draggedTarget = 'hina';
        updateUISelection("雛ちゃん", hinaData.x, hinaData.y, hinaData.angle);
        return;
    }

    for (let i = customObjects.length - 1; i >= 0; i--) {
        const obj = customObjects[i];
        if (isPointInsideRotatedBox(mouse.x, mouse.y, obj)) {
            isDragging = true; draggedTarget = i;
            updateUISelection(`ブロック[${i}]`, obj.x, obj.y, obj.angle);
            return;
        }
    }
}

function handleMove(e) {
    if (!isDragging || currentActionMode !== 'drag' || isPlaying) return;
    if (e.type === 'touchmove') e.preventDefault();

    const mouse = getPointerPos(e);
    if (draggedTarget === 'hina') {
        hinaData.x = Math.round(mouse.x); hinaData.y = Math.round(mouse.y);
        updateUISelection("雛ちゃん", hinaData.x, hinaData.y, hinaData.angle);
    } else if (typeof draggedTarget === 'number') {
        customObjects[draggedTarget].x = Math.round(mouse.x); customObjects[draggedTarget].y = Math.round(mouse.y);
        updateUISelection(`ブロック[${draggedTarget}]`, customObjects[draggedTarget].x, customObjects[draggedTarget].y, customObjects[draggedTarget].angle);
    }
    buildPhysicsWorld(false);
}

function handleEnd() { isDragging = false; }

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);
canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
window.addEventListener('touchend', handleEnd);

function updateUISelection(name, x, y, radAngle) {
    document.getElementById('selectedName').innerText = name;
    document.getElementById('selectedX').value = x;
    document.getElementById('selectedY').value = y;
    document.getElementById('selectedAngle').value = radToDeg(radAngle || 0);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let b = world.getBodyList(); b; b = b.getNext()) {
        const uData = b.getUserData();
        const pos = b.getPosition();
        const angle = b.getAngle();
        ctx.save();
        ctx.translate(pos.x * PPU, canvas.height - (pos.y * PPU));
        ctx.rotate(-angle);

        if (uData && uData.id === 'hina') {
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-(0.3 * PPU) / 2, -(0.7 * PPU) / 2, 0.3 * PPU, 0.7 * PPU);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-(0.3 * PPU) / 4, (0.7 * PPU) / 4, 0.15 * PPU, 0.1 * PPU);
        } else if (uData && uData.id === 'custom') {
            const obj = customObjects[uData.index];
            if (obj) {
                if (obj.type === 'static') { ctx.fillStyle = '#777777'; ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h); }
                else if (obj.type === 'dynamic') { ctx.fillStyle = '#44aa44'; ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h); }
                else if (obj.type === 'green_pass') { ctx.fillStyle = 'rgba(0, 255, 100, 0.4)'; ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2; ctx.strokeRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h); ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h); }
                else if (obj.type === 'purple_pass') { ctx.fillStyle = 'rgba(180, 0, 255, 0.4)'; ctx.strokeStyle = '#cc00ff'; ctx.lineWidth = 2; ctx.strokeRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h); ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h); }
                else if (obj.type === 'preset_tree') { ctx.fillStyle = '#228b22'; ctx.beginPath(); ctx.moveTo(0, -obj.h / 2); ctx.lineTo(-obj.w / 2, obj.h / 2); ctx.lineTo(obj.w / 2, obj.h / 2); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#8b4513'; ctx.fillRect(-obj.w / 6, obj.h / 4, obj.w / 3, obj.h / 4); }
                else if (obj.type === 'preset_snowman') { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, obj.h / 6, obj.w / 2.5, 0, Math.PI * 2); ctx.arc(0, -obj.h / 4, obj.w / 3.5, 0, Math.PI * 2); ctx.fill(); }
            }
        }
        ctx.restore();
    }

    spawnedBodies.forEach(item => {
        const pos = item.body.getPosition();
        ctx.save();
        ctx.translate(pos.x * PPU, canvas.height - (pos.y * PPU));
        if (item.type === 'ball') { ctx.beginPath(); ctx.arc(0, 0, BALL_RADIUS_PX, 0, 2 * Math.PI); ctx.fillStyle = '#44ffff'; ctx.fill(); }
        else if (item.type === 'box') { ctx.fillStyle = '#e67e22'; ctx.fillRect(-BOX_HALF_PX, -BOX_HALF_PX, BOX_HALF_PX * 2, BOX_HALF_PX * 2); }
        ctx.restore();
    });

    rawSearchResults.ball_left.forEach(item => {
        ctx.fillStyle = (item.turns === 1) ? '#ffff00' : '#aa00ff';
        ctx.beginPath(); ctx.arc(0, canvas.height - item.val, 5, 0, 2 * Math.PI); ctx.fill();
    });

    rawSearchResults.ball_right.forEach(item => {
        ctx.fillStyle = (item.turns === 1) ? '#ffff00' : '#aa00ff';
        ctx.beginPath(); ctx.arc(920, canvas.height - item.val, 5, 0, 2 * Math.PI); ctx.fill();
    });

    const boxStep = (rawSearchResults.box.length > 0 && rawSearchResults.box[0].val % 8 === 0) ? 8 : 2;
    const boxRanges = getGroupedRanges(rawSearchResults.box, boxStep);
    ctx.lineWidth = 6;
    boxRanges.forEach(r => {
        ctx.strokeStyle = (r.turns === 1) ? '#ffff00' : '#aa00ff';
        ctx.beginPath(); ctx.moveTo(r.start, canvas.height - 500); ctx.lineTo(r.end + 8, canvas.height - 500); ctx.stroke();
    });
}

function animate() {
    if (isPlaying) {
        world.step(1 / 60);

        if (hinaBodyRef && hinaBodyRef.getPosition().y < 0) {
            resetPositions();
        }

        if (isWaitingForSettlement) {
            launchFrameCounter++;
            const isSettled = (launchFrameCounter > 120 && launchFrameCounter % 5 === 0 && isWorldSettled(world));
            const isTimeout = (launchFrameCounter >= 1800);

            if (isSettled || isTimeout) {
                isWaitingForSettlement = false;
                currentTurn++;
                updateTurnUI();
                updateLaunchButtonsState(true);
            }
        }
    }

    draw();
    requestAnimationFrame(animate);
}

initScene();
animate();
</script>
