<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>雛ブレ2nd 物理予測エディタ</title>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3.27/dist/planck.min.js"></script>
    <style>
        body { background: #222; color: #fff; font-family: sans-serif; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        h1 { margin: 5px; font-size: 24px; }
        .main-container { display: flex; gap: 15px; max-width: 1250px; width: 100%; justify-content: center; }
        canvas { background: #111; border: 2px solid #555; display: block; cursor: crosshair; touch-action: none; }
        .sidebar { background: #333; padding: 15px; border-radius: 8px; width: 280px; font-size: 14px; box-sizing: border-box; }
        .panel { background: #444; padding: 10px; margin-bottom: 12px; border-radius: 6px; }
        .panel h3 { margin: 0 0 8px 0; font-size: 15px; border-bottom: 1px solid #666; padding-bottom: 3px; color: #44ffff; }
        .panel.ai-panel { border: 1px solid #00ffcc; }
        .panel.ai-panel h3 { color: #00ffcc; border-bottom-color: #008866; }
        .control-group { margin: 8px 0; display: flex; align-items: center; justify-content: space-between; }
        .control-group label { font-size: 12px; }
        input[type="number"], select { width: 75px; background: #222; color: #fff; border: 1px solid #666; padding: 3px; border-radius: 4px; }
        button { width: 100%; padding: 6px; margin-top: 5px; font-size: 13px; cursor: pointer; font-weight: bold; background: #555; color: #fff; border: 1px solid #777; border-radius: 4px; }
        button:hover { background: #666; }
        
        .square-btn-container { display: flex; gap: 10px; margin-bottom: 8px; }
        .square-btn {
            width: 100%;
            height: 55px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #333;
            border: 2px solid #666;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        .square-btn.active-ball {
            background: #005588;
            border-color: #00ccff;
            color: #00ffff;
            box-shadow: 0 0 8px #00ccff;
        }
        .square-btn.active-box {
            background: #884400;
            border-color: #ff9900;
            color: #ffcc00;
            box-shadow: 0 0 8px #ff9900;
        }
        .square-btn span { font-size: 18px; margin-bottom: 2px; }

        button.play-pause { background: #27ae60; border-color: #2ecc71; margin-bottom: 8px; font-size: 14px; }
        button.play-pause.paused { background: #e67e22; border-color: #f39c12; }

        button.ai { background: #008844; border-color: #00cc66; }
        button.ai:hover { background: #00aa55; }
        button.reset-marker { background: #886600; border-color: #bb9900; margin-top: 8px; }
        button.reset-marker:hover { background: #aa8800; }
        
        .btn-reset-pos { background: #d35400; border-color: #e67e22; margin-bottom: 5px; }
        .btn-reset-pos:hover { background: #e67e22; }
        
        .hint { font-size: 11px; color: #aaa; margin-top: 4px; line-height: 1.3; }
        .result-box { margin-top: 8px; font-size: 11px; color: #00ffcc; max-height: 120px; overflow-y: auto; background: #181818; padding: 6px; border-radius: 4px; border: 1px solid #333; line-height: 1.4; }
    </style>
</head>
<body>

    <h1>雛ちゃんブレイカー2nd 物理予測エディタ</h1>
    
    <div class="main-container">
        <div>
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            <div id="modeHint" style="text-align: left; font-size: 12px; color: #fffa00; margin-top: 5px; font-weight: bold;">
                モード: ドラッグ移動 (オブジェクトを直接移動できます)
            </div>
        </div>

        <div class="sidebar">
            <div class="panel">
                <h3>1. アクション & コントロール</h3>
                <button id="btnPlayPause" class="play-pause paused" onclick="togglePlayPause()">⏸ 物理停止中 (ドラッグ可)</button>
                
                <div class="square-btn-container">
                    <div id="btnModeBall" class="square-btn" onclick="setActionMode('ball')">
                        <span>🔵</span>ボール
                    </div>
                    <div id="btnModeBox" class="square-btn" onclick="setActionMode('box')">
                        <span>🟧</span>ボックス
                    </div>
                </div>
                <div class="hint">
                    ボール/ボックス選択後に画面タップで即時発射されます。
                </div>
            </div>

            <div class="panel ai-panel">
                <h3>🤖 ワンキル自動探索</h3>
                <div class="control-group">
                    <label>探索対象:</label>
                    <select id="searchTarget">
                        <option value="all">全ての項目 (ボール＋ボックス)</option>
                        <option value="ball_both">ボール (左右両方)</option>
                        <option value="ball_left">ボール (左のみ)</option>
                        <option value="ball_right">ボール (右のみ)</option>
                        <option value="box">ボックス (上空全域)</option>
                    </select>
                </div>
                <button class="ai" onclick="runAutoSearch()">自動探索を実行</button>
                <button class="reset-marker" onclick="clearMarkers()">マーカー表示をクリア</button>
                <div id="searchResult" class="result-box">探索結果がここに表示されます</div>
            </div>

            <div class="panel">
                <h3>2. オブジェクト追加</h3>
                <div class="control-group">
                    <label>種類:</label>
                    <select id="objType">
                        <option value="dynamic">動く(風呂・柱等)</option>
                        <option value="static">固定(床・壁等)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>初期X / Y:</label>
                    <div>
                        <input type="number" id="newX" value="480" style="width:35px;">
                        <input type="number" id="newY" value="100" style="width:35px;">
                    </div>
                </div>
                <div class="control-group">
                    <label>幅W / 高H:</label>
                    <div>
                        <input type="number" id="newW" value="200" style="width:35px;">
                        <input type="number" id="newH" value="20" style="width:35px;">
                    </div>
                </div>
                <button onclick="addObjectFromUI()">オブジェクト追加</button>
            </div>

            <div class="panel">
                <h3>3. 選択座標</h3>
                <div class="control-group">
                    <label>名前:</label>
                    <span id="selectedName" style="font-size:12px; color:#fffa00;">なし</span>
                </div>
                <div class="control-group">
                    <label>現在X / Y:</label>
                    <div>
                        <input type="number" id="selectedX" readonly style="background:#333; color:#aaa; width:35px;">
                        <input type="number" id="selectedY" readonly style="background:#333; color:#aaa; width:35px;">
                    </div>
                </div>
            </div>

            <button class="btn-reset-pos" onclick="resetPositions()">配置位置をリセット</button>
            <button onclick="resetScene()" style="background:#a30000; border-color:#d60000;">ステージ全リセット</button>
        </div>
    </div>

<script>
const PPU = 75; 
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let world;
let hinaData = { x: 480, y: 200, angle: 0 };
let customObjects = [];
let isPlaying = false; // 再生・停止フラグ
let spawnedBodies = [];

let currentActionMode = 'drag'; // 'drag' | 'ball' | 'box'
let successMarkers = []; // 探索結果マーカー

let isDragging = false;
let draggedTarget = null;

function initScene() {
    spawnedBodies = [];
    isPlaying = false;
    updatePlayPauseButton();
    buildPhysicsWorld(false); 
}

function buildPhysicsWorld(isFullSimulation) {
    world = new planck.World(planck.Vec2(0.0, -9.81));

    // 雛ちゃん生成
    const hinaBodyType = isFullSimulation ? 'dynamic' : 'static';
    const hBody = world.createBody({
        type: hinaBodyType,
        position: planck.Vec2(hinaData.x / PPU, hinaData.y / PPU),
        angle: hinaData.angle,
        linearDrag: 0.1,
        angularDrag: 0.1,
        gravityScale: 1.0
    });
    hBody.createFixture(planck.Box(0.3 / 2, 0.7 / 2), { 
        density: 1.0, friction: 0.4, restitution: 0.2 
    });
    hBody.setUserData({ id: 'hina' });

    // ブロック生成
    customObjects.forEach((obj, index) => {
        const bType = isFullSimulation ? obj.type : 'static';
        
        const body = world.createBody({
            type: bType,
            position: planck.Vec2(obj.x / PPU, obj.y / PPU),
            angle: obj.angle,
            angularDrag: 1.0
        });
        
        body.createFixture(planck.Box((obj.w / PPU) / 2, (obj.h / PPU) / 2), {
            density: obj.type === 'dynamic' ? 2.0 : 0.0,
            friction: 0.5,
            restitution: 0.2
        });
        body.setUserData({ id: 'custom', index: index });
    });
}

// 再生/停止 トグル
function togglePlayPause() {
    isPlaying = !isPlaying;
    if (isPlaying) {
        buildPhysicsWorld(true);
    }
    updatePlayPauseButton();
}

function updatePlayPauseButton() {
    const btn = document.getElementById('btnPlayPause');
    if (isPlaying) {
        btn.classList.remove('paused');
        btn.innerText = "▶ 物理動作中 (タップで停止)";
    } else {
        btn.classList.add('paused');
        btn.innerText = "⏸ 物理停止中 (ドラッグ可)";
    }
}

function setActionMode(mode) {
    if (currentActionMode === mode) {
        currentActionMode = 'drag';
    } else {
        currentActionMode = mode;
    }

    const btnBall = document.getElementById('btnModeBall');
    const btnBox = document.getElementById('btnModeBox');
    const hint = document.getElementById('modeHint');

    btnBall.classList.remove('active-ball');
    btnBox.classList.remove('active-box');

    if (currentActionMode === 'ball') {
        btnBall.classList.add('active-ball');
        hint.innerText = "モード: ボール発射 (タップ座標の高さから左右近い方へ飛びます)";
    } else if (currentActionMode === 'box') {
        btnBox.classList.add('active-box');
        hint.innerText = "モード: ボックス落下 (タップ座標のX位置の上空から落とします)";
    } else {
        hint.innerText = "モード: ドラッグ移動 (オブジェクトを直接移動できます)";
    }
}

function fireBallAtY(targetY, isLeft) {
    if (!isPlaying) {
        isPlaying = true;
        buildPhysicsWorld(true);
        updatePlayPauseButton();
    }

    const launchX_px = isLeft ? 30 : 930;

    const ball = world.createBody({
        type: 'dynamic',
        position: planck.Vec2(launchX_px / PPU, targetY / PPU)
    });
    ball.createFixture(planck.Circle(0.22), { 
        density: 1.5, friction: 0.2, restitution: 0.5 
    });

    const velocityX = isLeft ? 20.0 : -20.0;
    ball.setLinearVelocity(planck.Vec2(velocityX, -1.0));
    spawnedBodies.push({ body: ball, type: 'ball' });
}

function dropBoxAtX(targetX) {
    if (!isPlaying) {
        isPlaying = true;
        buildPhysicsWorld(true);
        updatePlayPauseButton();
    }
    
    const box = world.createBody({
        type: 'dynamic',
        position: planck.Vec2(targetX / PPU, 520 / PPU)
    });
    box.createFixture(planck.Box((40 / PPU) / 2, (40 / PPU) / 2), {
        density: 3.0,
        friction: 0.5,
        restitution: 0.1
    });

    spawnedBodies.push({ body: box, type: 'box' });
}

function resetPositions() {
    spawnedBodies = [];
    isPlaying = false;
    updatePlayPauseButton();
    buildPhysicsWorld(false);
}

function resetScene() {
    customObjects = [];
    hinaData = { x: 480, y: 200, angle: 0 };
    clearMarkers();
    document.getElementById('selectedName').innerText = "なし";
    document.getElementById('selectedX').value = "";
    document.getElementById('selectedY').value = "";
    initScene();
}

// --- 完全一致版 AI自動探索 ---
function runAutoSearch() {
    const target = document.getElementById('searchTarget').value;
    successMarkers = [];

    let rawResults = { ball_left: [], ball_right: [], box: [] };

    if (target === 'all' || target === 'ball_both' || target === 'ball_left') {
        for (let y = 0; y <= 540; y += 4) {
            if (simulateOneKill('ball', { isLeft: true, y: y })) {
                rawResults.ball_left.push(y);
                successMarkers.push({ type: 'ball_left', val: y });
            }
        }
    }

    if (target === 'all' || target === 'ball_both' || target === 'ball_right') {
        for (let y = 0; y <= 540; y += 4) {
            if (simulateOneKill('ball', { isLeft: false, y: y })) {
                rawResults.ball_right.push(y);
                successMarkers.push({ type: 'ball_right', val: y });
            }
        }
    }

    if (target === 'all' || target === 'box') {
        for (let x = 0; x <= 960; x += 8) {
            if (simulateOneKill('box', { x: x })) {
                rawResults.box.push(x);
                successMarkers.push({ type: 'box', val: x });
            }
        }
    }

    displaySearchResults(rawResults);
}

function simulateOneKill(type, params) {
    let simWorld = new planck.World(planck.Vec2(0.0, -9.81));

    // 本番と全く同じ物理パラメータで雛ちゃんを生成
    let simHina = simWorld.createBody({
        type: 'dynamic',
        position: planck.Vec2(hinaData.x / PPU, hinaData.y / PPU),
        angle: hinaData.angle,
        linearDrag: 0.1,
        angularDrag: 0.1,
        gravityScale: 1.0
    });
    simHina.createFixture(planck.Box(0.3 / 2, 0.7 / 2), { density: 1.0, friction: 0.4, restitution: 0.2 });

    // ブロック生成
    customObjects.forEach((obj) => {
        let b = simWorld.createBody({
            type: obj.type,
            position: planck.Vec2(obj.x / PPU, obj.y / PPU),
            angle: obj.angle,
            angularDrag: 1.0
        });
        b.createFixture(planck.Box((obj.w / PPU) / 2, (obj.h / PPU) / 2), { 
            density: obj.type === 'dynamic' ? 2.0 : 0.0,
            friction: 0.5,
            restitution: 0.2
        });
    });

    // 投射物生成
    if (type === 'ball') {
        const launchX = params.isLeft ? 30 : 930;
        let ball = simWorld.createBody({
            type: 'dynamic',
            position: planck.Vec2(launchX / PPU, params.y / PPU)
        });
        ball.createFixture(planck.Circle(0.22), { density: 1.5, friction: 0.2, restitution: 0.5 });
        ball.setLinearVelocity(planck.Vec2(params.isLeft ? 20.0 : -20.0, -1.0));
    } else if (type === 'box') {
        let box = simWorld.createBody({
            type: 'dynamic',
            position: planck.Vec2(params.x / PPU, 520 / PPU)
        });
        box.createFixture(planck.Box((40 / PPU) / 2, (40 / PPU) / 2), { density: 3.0, friction: 0.5, restitution: 0.1 });
    }

    for (let f = 0; f < 180; f++) {
        simWorld.step(1 / 60);
        let hPos = simHina.getPosition();
        if (hPos.y < 0) return true;
    }
    return false;
}

function formatRanges(arr, step, prefix) {
    if (arr.length === 0) return [];
    let ranges = [];
    let start = arr[0];
    let prev = arr[0];

    for (let i = 1; i < arr.length; i++) {
        if (arr[i] === prev + step) {
            prev = arr[i];
        } else {
            ranges.push({ start, end: prev });
            start = arr[i];
            prev = arr[i];
        }
    }
    ranges.push({ start, end: prev });

    return ranges.map(r => {
        if (r.start === r.end) {
            return `${prefix}${r.start}px`;
        } else {
            const span = (r.end - r.start) + step;
            return `${prefix}${r.start}〜${r.end}px (範囲: ${span}px)`;
        }
    });
}

function displaySearchResults(raw) {
    const resDiv = document.getElementById('searchResult');
    let html = '';

    const leftRanges = formatRanges(raw.ball_left, 4, 'Y ');
    if (leftRanges.length > 0) html += `<strong>【左ボール】</strong><br>` + leftRanges.join('<br>') + '<br>';

    const rightRanges = formatRanges(raw.ball_right, 4, 'Y ');
    if (rightRanges.length > 0) html += `<strong>【右ボール】</strong><br>` + rightRanges.join('<br>') + '<br>';

    const boxRanges = formatRanges(raw.box, 8, 'X ');
    if (boxRanges.length > 0) html += `<strong>【上空ボックス】</strong><br>` + boxRanges.join('<br>') + '<br>';

    if (html === '') {
        resDiv.innerHTML = 'ワンキルできる場所が見つかりませんでした。';
    } else {
        resDiv.innerHTML = html;
    }
}

function clearMarkers() {
    successMarkers = [];
    document.getElementById('searchResult').innerText = "探索結果がここに表示されます";
}

function addObjectFromUI() {
    const type = document.getElementById('objType').value;
    const x = parseFloat(document.getElementById('newX').value);
    const y = parseFloat(document.getElementById('newY').value);
    const w = parseFloat(document.getElementById('newW').value);
    const h = parseFloat(document.getElementById('newH').value);

    customObjects.push({ type, x, y, w, h, angle: 0 });
    initScene();
}

function getPointerPos(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: clientX - rect.left,
        y: canvas.height - (clientY - rect.top)
    };
}

function handleStart(e) {
    if (e.type === 'touchstart') e.preventDefault();
    const mouse = getPointerPos(e);

    if (currentActionMode === 'ball') {
        const isLeft = (mouse.x < canvas.width / 2);
        fireBallAtY(Math.round(mouse.y), isLeft);
        return;
    }

    if (currentActionMode === 'box') {
        dropBoxAtX(Math.round(mouse.x));
        return;
    }

    // 停止中のみドラッグ移動可能
    if (isPlaying) return;

    if (Math.abs(mouse.x - hinaData.x) < 25 && Math.abs(mouse.y - hinaData.y) < 35) {
        isDragging = true;
        draggedTarget = 'hina';
        updateUISelection("雛ちゃん", hinaData.x, hinaData.y);
        return;
    }

    for (let i = customObjects.length - 1; i >= 0; i--) {
        const obj = customObjects[i];
        if (Math.abs(mouse.x - obj.x) < obj.w/2 && Math.abs(mouse.y - obj.y) < obj.h/2) {
            isDragging = true;
            draggedTarget = i;
            const label = (obj.type === 'static' ? '固定' : '動く') + 'ブロック[' + i + ']';
            updateUISelection(label, obj.x, obj.y);
            return;
        }
    }
}

function handleMove(e) {
    if (!isDragging || currentActionMode !== 'drag' || isPlaying) return;
    if (e.type === 'touchmove') e.preventDefault();

    const mouse = getPointerPos(e);
    if (draggedTarget === 'hina') {
        hinaData.x = Math.round(mouse.x);
        hinaData.y = Math.round(mouse.y);
        updateUISelection("雛ちゃん", hinaData.x, hinaData.y);
    } else if (typeof draggedTarget === 'number') {
        customObjects[draggedTarget].x = Math.round(mouse.x);
        customObjects[draggedTarget].y = Math.round(mouse.y);
        const obj = customObjects[draggedTarget];
        const label = (obj.type === 'static' ? '固定' : '動く') + 'ブロック[' + draggedTarget + ']';
        updateUISelection(label, obj.x, obj.y);
    }
    buildPhysicsWorld(false);
}

function handleEnd() {
    isDragging = false;
}

canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);
canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
window.addEventListener('touchend', handleEnd);

function updateUISelection(name, x, y) {
    document.getElementById('selectedName').innerText = name;
    document.getElementById('selectedX').value = x;
    document.getElementById('selectedY').value = y;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let b = world.getBodyList(); b; b = b.getNext()) {
        const uData = b.getUserData();
        const pos = b.getPosition();
        const angle = b.getAngle();
        ctx.save();
        ctx.translate(pos.x * PPU, canvas.height - (pos.y * PPU));
        ctx.rotate(-angle);

        if (uData && uData.id === 'hina') {
            ctx.fillStyle = '#ff4444';
            ctx.fillRect(-(0.3 * PPU) / 2, -(0.7 * PPU) / 2, 0.3 * PPU, 0.7 * PPU);
        } else if (uData && uData.id === 'custom') {
            const obj = customObjects[uData.index];
            ctx.fillStyle = (obj.type === 'static') ? '#777777' : '#44aa44';
            ctx.fillRect(-obj.w / 2, -obj.h / 2, obj.w, obj.h);
        }
        ctx.restore();
    }

    spawnedBodies.forEach(item => {
        const pos = item.body.getPosition();
        ctx.save();
        ctx.translate(pos.x * PPU, canvas.height - (pos.y * PPU));
        
        if (item.type === 'ball') {
            ctx.beginPath();
            ctx.arc(0, 0, 0.22 * PPU, 0, 2 * Math.PI);
            ctx.fillStyle = '#44ffff';
            ctx.fill();
        } else if (item.type === 'box') {
            ctx.fillStyle = '#e67e22';
            ctx.fillRect(-20, -20, 40, 40);
        }
        ctx.restore();
    });

    // 🟡 黄色マーカー描画
    ctx.fillStyle = '#ffff00';
    successMarkers.forEach(m => {
        if (m.type === 'ball_left') {
            ctx.beginPath();
            ctx.arc(30, canvas.height - m.val, 5, 0, 2 * Math.PI);
            ctx.fill();
        } else if (m.type === 'ball_right') {
            ctx.beginPath();
            ctx.arc(930, canvas.height - m.val, 5, 0, 2 * Math.PI);
            ctx.fill();
        } else if (m.type === 'box') {
            ctx.beginPath();
            ctx.arc(m.val, canvas.height - 520, 4, 0, 2 * Math.PI);
            ctx.fill();
        }
    });
}

function animate() {
    if (isPlaying) {
        world.step(1 / 60);
    }
    draw();
    requestAnimationFrame(animate);
}

initScene();
animate();
</script>
</body>
</html>
